<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ШИННИЙ КАЛЬКУЛЯТОР</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            background: #f0f2f5;
            color: #333;
        }

        .card {
            background: #fff;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);
            max-width: 420px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #1a73e8;
            margin: 0 0 14px;
            font-size: 22px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 600;
            font-size: 14px;
            color: #666;
        }

        select, input {
            width: 100%;
            padding: 13px;
            border: 2px solid #dfe1e5;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 17px;
            outline: none;
            transition: 0.2s;
        }

        select:focus, input:focus {
            border-color: #1a73e8;
        }

        .result-box {
            background: #e8f0fe;
            border: 1px solid #c2d7ff;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: #1967d2;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 30px;
            font-weight: 800;
            color: #1a73e8;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .m-btn {
            flex: 1;
            padding: 11px;
            text-align: center;
            background: #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            user-select: none;
        }

        .m-btn.active {
            background: #1a73e8;
            color: white;
        }

        .m-btn.active.red {
            background: #d93025;
        }

        #btn-send {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: #1a73e8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2 id="header">Шинний калькулятор</h2>

    <div id="ops-controls" class="mode-toggle">
        <div id="m-add" class="m-btn active" onclick="setOperationMode('ADD')">ПРИЙОМ</div>
        <div id="m-sub" class="m-btn" onclick="setOperationMode('REMOVE')">СПИСАННЯ</div>
    </div>

    <label>Оберіть радіус (R):</label>
    <select id="diameter" onchange="onDiameterChange()">
        <option value="R13">R13</option>
        <option value="R14">R14</option>
        <option value="R15">R15</option>
        <option value="R16">R16</option>
        <option value="R17">R17</option>
        <option value="R18">R18</option>
        <option value="R19">R19</option>
        <option value="R20">R20</option>
        <option value="R21">R21</option>
        <option value="R22">R22</option>
        <option value="R16c">R16c</option>
        <option value="R17c">R17c</option>
        <option value="R17i5">R17i5</option>
        <option value="R19i5">R19i5</option>
        <option value="R22і5">R22і5</option>
        <option value="НЕВІДОМІ">НЕВІДОМІ</option>
    </select>

    <label>Кількість (шт):</label>
    <input type="number" id="count" value="1" min="1" oninput="updateTotal()">

    <label>Вага за 1 шт (кг):</label>
    <input type="number" id="unit-weight" step="0.1" oninput="manualWeight()">

    <div class="result-box">
        <div class="result-label">Загальна вага</div>
        <div class="result-value"><span id="total-w">0.00</span> кг</div>
    </div>

    <button id="btn-send" onclick="sendOperation()">ЗБЕРЕГТИ В БАЗУ</button>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const params = new URLSearchParams(window.location.search);
    const pageMode = (params.get('mode') || 'operations').toLowerCase();

    const weights = {
        R13: 5,
        R14: 6,
        R15: 6.5,
        R16: 7,
        R17: 10.0,
        R18: 11,
        R19: 12,
        R20: 12.5,
        R21: 14,
        R22: 14.5,
        R16с: 15,
        R17c: 15.0,
        R17i5: 25.0,
        R19i5: 45.0,
        R22і5: 50,
        НЕВІДОМІ: 0.0001
    };

    let operationMode = 'ADD';
    let isManual = false;

    function applyPageMode() {
        const opsControls = document.getElementById('ops-controls');
        const sendButton = document.getElementById('btn-send');
        const header = document.getElementById('header');

        if (pageMode === 'calc') {
            header.textContent = 'Калькулятор ваги';
            opsControls.classList.add('hidden');
            sendButton.classList.add('hidden');
        } else {
            header.textContent = 'Шинний калькулятор';
            opsControls.classList.remove('hidden');
            sendButton.classList.remove('hidden');
        }
    }

    function setOperationMode(mode) {
        operationMode = mode;
        const addBtn = document.getElementById('m-add');
        const subBtn = document.getElementById('m-sub');
        const sendBtn = document.getElementById('btn-send');

        addBtn.classList.toggle('active', mode === 'ADD');
        subBtn.classList.toggle('active', mode === 'REMOVE');
        subBtn.classList.toggle('red', mode === 'REMOVE');
        sendBtn.style.background = mode === 'ADD' ? '#1a73e8' : '#d93025';
    }

    function onDiameterChange() {
        isManual = false;
        updateTotal();
    }

    function manualWeight() {
        isManual = true;
        updateTotal();
    }

    function updateTotal() {
        const diameter = document.getElementById('diameter').value;
        const countValue = Number(document.getElementById('count').value || 0);
        const unitInput = document.getElementById('unit-weight');

        if (!isManual || !unitInput.value) {
            unitInput.value = weights[diameter];
        }

        const total = (Number(unitInput.value || 0) * countValue).toFixed(2);
        document.getElementById('total-w').innerText = total;
    }

    function sendOperation() {
        if (pageMode === 'calc') return;

        const diameter = document.getElementById('diameter').value;
        const countValue = document.getElementById('count').value;
        const totalWeight = document.getElementById('total-w').innerText;
        const payload = `${operationMode} ${diameter} КІЛЬКІСТЬ ${countValue} ВАГА ${totalWeight}`;

        if (tg && typeof tg.sendData === 'function') {
            tg.sendData(payload);
        }
    }

    applyPageMode();
    setOperationMode('ADD');
    updateTotal();
</script>
</body>
</html>
